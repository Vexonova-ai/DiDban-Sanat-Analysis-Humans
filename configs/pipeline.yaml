# Initial engineering defaults; not validated production settings.
detection:
  model: yolov8n.pt
  image_size: 640
  confidence: 0.1
  device: auto
tracking:
  algorithm: bytetrack
  reid_model: osnet_x1_0
buffer:
  confirmation_frames: 15
fashion:
  model: mattmdjaga/segformer_b2_clothes
  device: auto
pipeline:
  workers: 3
  queue_size: 8
storage:
  output_dir: outputs/
  save_masks: true
  save_json: true
